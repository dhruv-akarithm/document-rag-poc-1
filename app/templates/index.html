<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document RAG Admin Panel</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f5f5f5;
      }

      h1 {
        margin-bottom: 10px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        margin-bottom: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      input[type="file"],
      input[type="text"] {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        box-sizing: border-box;
      }

      button {
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #222;
        color: white;
      }

      button:hover {
        opacity: 0.85;
      }

      .result {
        margin-top: 20px;
        padding: 15px;
        background: #f0f0f0;
        border-radius: 6px;
        white-space: pre-wrap;
      }

      .source {
        margin-top: 8px;
        font-size: 14px;
        color: #555;
      }

      .model-section {
        border-top: 1px solid #ddd;
        padding-top: 20px;
        margin-top: 20px;
      }

      .model-section:first-child {
        border-top: none;
        padding-top: 0;
        margin-top: 0;
      }

      .model-section h3 {
        margin-bottom: 8px;
      }

      .model-info {
        background: #f7f7f7;
        padding: 15px;
        border-radius: 6px;
        margin: 12px 0;
      }

      .model-info p {
        margin: 6px 0;
      }

      .model-select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        box-sizing: border-box;
      }

      .model-warning {
        background: #fff3cd;
        color: #664d03;
        padding: 12px;
        border-radius: 6px;
        margin-top: 10px;
      }

      .model-success {
        background: #d1e7dd;
        color: #0f5132;
        padding: 12px;
        border-radius: 6px;
        margin-top: 10px;
      }

      .model-error {
        background: #f8d7da;
        color: #842029;
        padding: 12px;
        border-radius: 6px;
        margin-top: 10px;
      }

      .switch-button {
        margin-top: 5px;
      }
    </style>
  </head>

  <body>
    <h1>Document RAG Admin Panel</h1>

    <p class="subtitle">
      Upload documents, index them in Pinecone, and ask questions using Gemini.
    </p>

    <!-- Upload Section -->

    <div class="card">
      <h2>Upload Documents</h2>

      <form id="uploadForm">
        <input
          type="file"
          id="files"
          name="files"
          accept=".pdf"
          multiple
          required
        />

        <button type="submit">Upload & Index</button>
      </form>

      <div id="uploadResult" class="result" style="display: none"></div>
    </div>

    <!-- Model Management Section -->

    <div class="card">
      <h2>Model Management</h2>

      <p class="subtitle">
        Manage the models used by the RAG application.
      </p>

      <div id="modelManagement">
        Loading models...
      </div>

      <div id="lifecycleWarnings"></div>
    </div>

    <!-- Question Section -->

    <div class="card">
      <h2>Ask a Question</h2>

      <form id="questionForm">
        <input
          type="text"
          id="question"
          placeholder="Ask something about the uploaded documents..."
          required
        />

        <button type="submit">Ask</button>
      </form>

      <div id="answer" class="result" style="display: none"></div>
    </div>

    <script>
      document
        .getElementById("uploadForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const files = document.getElementById("files").files;

          const formData = new FormData();

          for (const file of files) {
            formData.append("files", file);
          }

          const response = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          const result = document.getElementById("uploadResult");

          result.style.display = "block";

          result.textContent = data.results
            .map((item) => `${item.filename}: ${item.message}`)
            .join("\n");
        });

      document
        .getElementById("questionForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const question = document.getElementById("question").value;

          const response = await fetch(
            `/ask?question=${encodeURIComponent(question)}`,
            {
              method: "POST",
            },
          );

          const data = await response.json();

          const answer = document.getElementById("answer");

          answer.style.display = "block";

          let output = data.answer;

          if (data.sources.length > 0) {
            output += "\n\nSources:\n";

            data.sources.forEach((source) => {
              output +=
                `${source.document} ` +
                `(chunk ${source.chunk}, ` +
                `score ${source.score})\n`;
            });
          }

          answer.textContent = output;
        });

      async function loadModels() {
        try {
          const response = await fetch("/models");

          if (!response.ok) {
            throw new Error("Failed to load models.");
          }

          const data = await response.json();

          const container = document.getElementById("modelManagement");

          container.innerHTML = "";

          const roles = [
            {
              key: "cheap_fast",
              title: "Cheap / Fast Model",
              description: "Routing, OCR and basic tasks",
            },
            {
              key: "powerful",
              title: "Powerful Model",
              description:
                "Final answers, complex reasoning and hard accounting questions",
            },
          ];

          roles.forEach((role) => {
            const activeModel = data.active_roles[role.key];

            const availableModels = Object.entries(data.models).filter(
              ([modelId, model]) =>
                model.role === role.key &&
                model.status === "active"
            );

            const section = document.createElement("div");

            section.className = "model-section";

            const options = availableModels
              .map(([modelId, model]) => {
                return `
                  <option value="${modelId}" ${
                    modelId === activeModel ? "selected" : ""
                  }>
                    ${model.display_name}
                  </option>
                `;
              })
              .join("");

            const activeModelData = data.models[activeModel];

            section.innerHTML = `
              <h3>${role.title}</h3>

              <p>${role.description}</p>

              <div class="model-info">
                <p>
                  <strong>Active Model:</strong>
                  ${activeModelData.display_name}
                </p>

                <p>
                  <strong>Status:</strong>
                  ${activeModelData.status}
                </p>

                <p>
                  <strong>Free Tier:</strong>
                  ${activeModelData.free_tier ? "Available" : "Not available"}
                </p>

                <p>
                  <strong>Input:</strong>
                  $${activeModelData.pricing.input_per_1m_tokens ?? "N/A"}
                  / 1M tokens
                </p>

                <p>
                  <strong>Output:</strong>
                  $${activeModelData.pricing.output_per_1m_tokens ?? "N/A"}
                  / 1M tokens
                </p>
              </div>

              <label>
                <strong>Select Model</strong>
              </label>

              <select
                class="model-select"
                id="select-${role.key}"
              >
                ${options}
              </select>

              <button
                class="switch-button"
                onclick="switchModel('${role.key}')"
              >
                Switch Model
              </button>

              <div id="result-${role.key}"></div>
            `;

            container.appendChild(section);
          });

        } catch (error) {
          document.getElementById("modelManagement").innerHTML =
            `<div class="model-error">
              Failed to load model information: ${error.message}
            </div>`;
        }
      }


      async function switchModel(role) {
        const select = document.getElementById(`select-${role}`);

        const modelId = select.value;

        const result = document.getElementById(`result-${role}`);

        result.innerHTML = "Switching model...";

        try {
          const response = await fetch("/models/switch", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              role: role,
              model_id: modelId,
            }),
          });

          const data = await response.json();

          if (data.success) {
            result.innerHTML = `
              <div class="model-success">
                ${data.message}
              </div>
            `;

            await loadModels();
            await loadLifecycleWarnings();

          } else {
            result.innerHTML = `
              <div class="model-error">
                ${data.message}
              </div>
            `;
          }

        } catch (error) {
          result.innerHTML = `
            <div class="model-error">
              Failed to switch model: ${error.message}
            </div>
          `;
        }
      }


      async function loadLifecycleWarnings() {
        try {
          const response = await fetch("/models/lifecycle");

          const data = await response.json();

          const container =
            document.getElementById("lifecycleWarnings");

          container.innerHTML = "";

          if (data.warnings.length === 0) {
            return;
          }

          data.warnings.forEach((warning) => {

            const warningElement =
              document.createElement("div");

            warningElement.className = "model-warning";

            warningElement.innerHTML = `
              <strong>⚠ Model Lifecycle Warning</strong>

              <p>
                <strong>Model:</strong>
                ${warning.model}
              </p>

              <p>
                <strong>Status:</strong>
                ${warning.status}
              </p>

              <p>
                <strong>Recommended Replacement:</strong>
                ${warning.replacement || "Not specified"}
              </p>

              <p>
                <strong>Shutdown Date:</strong>
                ${warning.shutdown_date || "Not specified"}
              </p>
            `;

            container.appendChild(warningElement);
          });

        } catch (error) {
          console.error(
            "Failed to load lifecycle warnings:",
            error
          );
        }
      }


      loadModels();
      loadLifecycleWarnings();
    </script>
  </body>
</html>
